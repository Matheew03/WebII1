<section class="contacto-section">
    <h2 class="section-title">Ponte en Contacto!!</h2>

    <div class="contacto-container">
        <form [formGroup]= "formularioContacto" (ngSubmit) ="enviar()">
            <div class="form-group">
                <label for="name">Nombre de Usuario / Nickname</label>
                <input formControlName="name" type="text" required maxlength = "10" pattern='^[a-zA-ZáéíóúÁÉÍÓÚñÑ ]+$' >
            </div>

            <div class="form-group">
                <label for="name">Email / Correo Electronico</label>
                <input formControlName="email" type="email" pattern='^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$'>
            </div>

            <div class="form-group">
                <label for="name">Numero de telefono</label>
                <input formControlName="telefono" type="tel" minlength="10" maxlength="10" pattern='^[0-9]+$'>
            </div>

            <div class="form-group">
                <label for="name">Descripcion</label>
                <input formControlName="descripcion" type="text">
            </div>

            <button type="submit" class="btn-enviar">Enviar</button>

        </form>
    </div>
</section>
