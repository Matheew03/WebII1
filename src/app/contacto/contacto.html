<section class="contacto-section">
    <h2 class="section-title">Ponte en Contacto</h2>

    <div class="contacto-container">
        <form [formGroup]="formularioContacto" (ngSubmit)="enviar()">
            <div class="form-group">
                <label for="name">Nombre de Usuario / Nickname</label>
                <input id="name" formControlName="name" type="text" placeholder="Ej: PlayerOne" />
            </div>

            <div class="form-group">
                <label for="email">Email / Correo Electrónico</label>
                <input id="email" formControlName="email" type="email" placeholder="ejemplo@correo.com" />
            </div>

            <div class="form-group">
                <label for="telefono">Número de Teléfono</label>
                <input id="telefono" formControlName="telefono" type="tel" placeholder="1234567890" maxlength="10" />
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción / Mensaje</label>
                <textarea id="descripcion" formControlName="descripcion" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
    </div>
</section>
