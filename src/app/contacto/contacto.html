<section class="contacto-section">
    <h2 class="section-title">Ponte en Contacto</h2>
    <p class="contacto-sub">¿Tienes algún problema con tu juego o buscas un título en específico? Escríbenos.</p>

    <div class="contacto-container">
        <form class="form-contacto">
            <div class="form-group">
                <label for="nombre">Nombre de Usuario / Nickname</label>
                <input type="text" id="nombre" placeholder="Ej. PlayerOne" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu@correo.com" required>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto</label>
                <select id="asunto">
                    <option value="soporte">Soporte Técnico / Claves</option>
                    <option value="ventas">Dudas sobre Productos</option>
                    <option value="otros">Otros asuntos</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensaje">Tu Mensaje</label>
                <textarea id="mensaje" rows="5" placeholder="Escribe los detalles aquí..." required></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
    </div>
</section>
